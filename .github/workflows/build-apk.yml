name: Build Thrive11 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out project
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      - name: Build signed release APK
        run: gradle :app:assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Thrive11-v1.2-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Thrive11-Android-APK-v1.2
          path: Thrive11-v1.2-release.apk
          if-no-files-found: error
